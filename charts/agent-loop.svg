<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="DejaVu Sans, sans-serif">
<rect width="1000" height="470" fill="#ffffff"/>
<text x="16" y="30" font-size="19" font-weight="bold" fill="#111">The agent loop: how OpenCode works a task</text>
<text x="16" y="52" font-size="12.5" fill="#444">One prompt becomes many model round-trips; the loop can even change its own configuration along the way.</text>
<defs><marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#444"/></marker></defs>
<rect x="330" y="76" width="320" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="490.0" y="109.5" font-size="12.5" fill="#111" text-anchor="middle">You: a prompt in the project folder</text>
<rect x="330" y="162" width="320" height="66" rx="6" fill="#ffffff" stroke="#3572a5" stroke-width="1.6"/>
<text x="490.0" y="191.0" font-size="12.5" fill="#111" text-anchor="middle">OpenCode</text>
<text x="490.0" y="208.0" font-size="12.5" fill="#111" text-anchor="middle">gathers files, AGENTS.md, config</text>
<rect x="330" y="256" width="320" height="66" rx="6" fill="#ffffff" stroke="#2ea043" stroke-width="1.6"/>
<text x="490.0" y="285.0" font-size="12.5" fill="#111" text-anchor="middle">The model</text>
<text x="490.0" y="302.0" font-size="12.5" fill="#111" text-anchor="middle">(the llama-server from ch 03)</text>
<rect x="716" y="250" width="258" height="78" rx="6" fill="#ffffff" stroke="#d29922" stroke-width="1.6"/>
<text x="845.0" y="285.0" font-size="12.5" fill="#111" text-anchor="middle">Tools run: read, edit, bash,</text>
<text x="845.0" y="302.0" font-size="12.5" fill="#111" text-anchor="middle">install, configure, spawn</text>
<rect x="330" y="372" width="320" height="66" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="490.0" y="401.0" font-size="12.5" fill="#111" text-anchor="middle">The answer</text>
<text x="490.0" y="418.0" font-size="12.5" fill="#111" text-anchor="middle">real edits on disk, a diff you can check</text>
<rect x="716" y="372" width="258" height="56" rx="6" fill="#ffffff" stroke="#d29922" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="845.0" y="396.0" font-size="12.5" fill="#111" text-anchor="middle">Or a subagent:</text>
<text x="845.0" y="413.0" font-size="12.5" fill="#111" text-anchor="middle">its own smaller loop</text>
<line x1="490" y1="134" x2="490" y2="162" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="490" y1="228" x2="490" y2="256" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="490" y1="322" x2="490" y2="372" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="650" y1="274" x2="716" y2="274" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="683.0" y="266.0" font-size="10.5" fill="#555" text-anchor="middle">tool call</text>
<line x1="716" y1="306" x2="650" y2="306" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="683.0" y="320.0" font-size="10.5" fill="#555" text-anchor="middle">result: repeat</text>
<line x1="760" y1="250" x2="760" y2="190" stroke="#444" stroke-width="1.8"/>
<line x1="760" y1="190" x2="650" y2="190" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="770.0" y="184.0" font-size="10.5" fill="#555" text-anchor="middle">config changes feed back</text>
<line x1="845" y1="328" x2="845" y2="372" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="902.0" y="352.0" font-size="10.5" fill="#555" text-anchor="middle">spawns one</text>
</svg>